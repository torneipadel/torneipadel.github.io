name: One-off Bove KO fields

on:
  push:
    paths:
      - '.github/one-off-bove-ko-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grafica-rifinitura
          fetch-depth: 1
      - name: Add editable semifinal and final court times
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Bove.html')
          s=p.read_text(encoding='utf-8')
          old_state='''    semiTop:[],\n\n    sTopRes:Array(2).fill("-"),\n\n\n\n    finalTop:[],\n\n    fTopRes:"-",\n\n\n\n    campioneTop:null,'''
          new_state='''    semiTop:[],\n\n    sTopRes:Array(2).fill("-"),\n\n    sCamp:["Campo 1","Campo 2"],\n\n    sTime:["20:00","20:30"],\n\n\n    finalTop:[],\n\n    fTopRes:"-",\n\n    fCamp:"Campo 1",\n\n    fTime:"21:00",\n\n\n    campioneTop:null,'''
          if s.count(old_state)!=1: raise SystemExit(f'STATE TARGET COUNT={s.count(old_state)}')
          s=s.replace(old_state,new_state,1)
          old_recovery='''const arrayDaRecuperare=["A","B","C","D","E","F","Ares","Bres","Cres","Dres","Eres","Fres","Atime","Btime","Ctime","Dtime","Etime","Ftime","Acamp","Bcamp","Ccamp","Dcamp","Ecamp","Fcamp","qRes","sTopRes","fTopRes","finalTop"];'''
          new_recovery='''const arrayDaRecuperare=["A","B","C","D","E","F","Ares","Bres","Cres","Dres","Eres","Fres","Atime","Btime","Ctime","Dtime","Etime","Ftime","Acamp","Bcamp","Ccamp","Dcamp","Ecamp","Fcamp","qRes","sTopRes","sCamp","sTime","finalTop","fTopRes","fCamp","fTime"];'''
          if s.count(old_recovery)!=1: raise SystemExit(f'RECOVERY TARGET COUNT={s.count(old_recovery)}')
          s=s.replace(old_recovery,new_recovery,1)
          script='''<script>\n(function(){\n    const originaleRenderMatchCard=window.renderMatchCard;\n    if(typeof originaleRenderMatchCard!=="function") return;\n    function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}\n    function salvaKOInfo(type,index,campo,ora){\n        if(type==="S"){\n            if(!Array.isArray(state.sCamp)) state.sCamp=["Campo 1","Campo 2"];\n            if(!Array.isArray(state.sTime)) state.sTime=["20:00","20:30"];\n            state.sCamp[index]=campo; state.sTime[index]=ora;\n        }else if(type==="F"){state.fCamp=campo; state.fTime=ora;}\n        if(typeof updateAndSync==="function") updateAndSync();\n    }\n    window.salvaKOInfo=salvaKOInfo;\n    window.renderMatchCard=function(titolo,match,type,index,risultato){\n        const html=originaleRenderMatchCard(titolo,match,type,index,risultato);\n        if(type!=="S"&&type!=="F") return html;\n        let campo,ora;\n        if(type==="S"){\n            if(!Array.isArray(state.sCamp)) state.sCamp=["Campo 1","Campo 2"];\n            if(!Array.isArray(state.sTime)) state.sTime=["20:00","20:30"];\n            campo=state.sCamp[index]??""; ora=state.sTime[index]??"";\n        }else{campo=state.fCamp??"Campo 1"; ora=state.fTime??"21:00";}\n        const meta=`<div class="match-extra" style="display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;">\n<label>Campo <input data-ko-campo value="${esc(campo)}" style="width:90px;" onchange="salvaKOInfo('${type}',${index},this.value,this.parentElement.parentElement.querySelector('[data-ko-time]').value)"></label>\n<label>Ora <input data-ko-time type="time" value="${esc(ora)}" style="width:105px;" onchange="salvaKOInfo('${type}',${index},this.parentElement.parentElement.querySelector('[data-ko-campo]').value,this.value)"></label>\n</div>`;\n        return html.replace(/<\\/div>\\s*$/,meta+"</div>");\n    };\n    setTimeout(()=>{if(typeof renderKO==="function") renderKO();},0);\n})();\n</script>\n</body>'''
          if s.count('</body>')!=1: raise SystemExit(f'BODY TARGET COUNT={s.count("</body>")}')
          s=s.replace('</body>',script,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('Bove.html').read_text(encoding='utf-8')
          required=['sCamp:["Campo 1","Campo 2"]','sTime:["20:00","20:30"]','fCamp:"Campo 1"','fTime:"21:00"','salvaKOInfo']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('MISSING: '+repr(missing))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          git rm .github/one-off-bove-ko-trigger .github/workflows/one-off-bove-ko.yml
          git commit -m 'Add editable semifinal and final court times'
          git push origin grafica-rifinitura
