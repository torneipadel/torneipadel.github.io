<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iscrizione Torneo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg-image:url('2pages.jpg')}
*{box-sizing:border-box}
html{margin:0;min-height:100%;width:100%}
body{margin:0;min-height:100vh;width:100%;font-family:'Open Sans',Arial,sans-serif;background:linear-gradient(rgba(7,18,25,.28),rgba(7,18,25,.42)),var(--bg-image) center/cover fixed no-repeat;color:#fff;overflow-x:hidden;display:grid;place-items:center;padding:24px}
.card{width:min(760px,calc(100vw - 32px));margin:0;padding:24px 24px 22px;border:1px solid rgba(255,255,255,.24);border-radius:26px;background:rgba(255,255,255,.12);box-shadow:0 20px 55px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.16);backdrop-filter:blur(18px) saturate(125%);-webkit-backdrop-filter:blur(18px) saturate(125%);text-align:center;justify-self:center;align-self:center}
.logo{display:block;width:150px;max-width:100%;height:auto;max-height:86px;margin:0 auto 16px;object-fit:contain;filter:brightness(1.24) contrast(.90) saturate(.82) drop-shadow(0 0 7px rgba(255,255,255,.18)) drop-shadow(0 8px 20px rgba(0,0,0,.20));opacity:.97}
h2{margin:8px 0 16px;font-size:clamp(27px,5vw,34px);line-height:1.08;font-weight:700;letter-spacing:-.03em;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.28)}
.info{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:14px 16px;border-radius:16px;margin:12px 0;font-size:12px;font-weight:400;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);line-height:1.55}
.info b{font-weight:700}
button{width:100%;height:36px;padding:0 14px;margin-top:10px;border:1px solid rgba(255,255,255,.28);border-radius:12px;cursor:pointer;font-family:'Open Sans',Arial,sans-serif;font-weight:800;font-size:10px;line-height:1;letter-spacing:0;color:#fff;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:.2s ease;text-transform:none}
.btn{background:rgba(255,255,255,.22);box-shadow:none}.back{background:rgba(255,255,255,.08);box-shadow:none}
button:hover{background:rgba(255,255,255,.28);transform:translateY(-1px)}button:disabled{opacity:.55;cursor:not-allowed;transform:none}
.successo{color:#86efac;font-size:10px;font-weight:700;line-height:1.45;margin-top:12px}.errore{color:#fecaca;font-size:10px;font-weight:700;line-height:1.45;margin-top:12px}
#messaggio p{margin:0}
@media(max-width:600px){body{padding:16px;background-attachment:scroll}.card{width:calc(100vw - 20px);padding:22px 16px 20px;border-radius:24px}.logo{width:135px;max-height:78px;margin-bottom:14px}h2{font-size:27px;margin:8px 0 14px}.info{padding:13px 14px;margin:10px 0;font-size:12px}button{height:36px;font-size:10px;margin-top:9px}}
</style>
</head>
<body>
<div class="card">
<img src="logo_index.jpg" class="logo" alt="NEXT POINT PADEL">
<h2>🏆 Iscrizione torneo</h2>
<div id="datiTorneo">Caricamento torneo...</div>
<div id="datiUtente"></div>
<button id="btnConferma" class="btn" onclick="confermaIscrizione()">CONFERMA ISCRIZIONE</button>
<button class="back" onclick="tornaTornei()">⬅ Torna ai tornei</button>
<div id="messaggio"></div>
</div>
<script>
const sb=supabase.createClient("https://iybjvtmfaupgthqqsngd.supabase.co","sb_publishable_oLLML3_ne0I1dWKIinSRNA_K1Ao5SOl",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const torneoId=new URLSearchParams(window.location.search).get("torneo");
let torneo=null,utente=null,profilo=null,iscrittiCorrenti=0,limiteCorrente=0;
async function inizializza(){try{if(!torneoId){mostraMessaggio("❌ Torneo non selezionato","errore");return}const {data:{user},error:erroreUser}=await sb.auth.getUser();if(erroreUser||!user){window.location.href="index.html";return}utente=user;const {data:torneoLetto,error:erroreTorneo}=await sb.from("tornei").select(`id,nome,data,posti,stato,iscrizioni_chiuse,formula,configurazione`).eq("id",Number(torneoId)).single();if(erroreTorneo||!torneoLetto){console.error("Errore caricamento torneo",erroreTorneo);mostraMessaggio("❌ Torneo non trovato","errore");return}torneo=torneoLetto;const {data:profiloLetto,error:erroreProfilo}=await sb.from("profili").select(`nome,cognome,email,telefono,livello,note`).eq("user_id",user.id).single();if(erroreProfilo)console.warn("Profilo non trovato",erroreProfilo);profilo=profiloLetto||null;await aggiornaDisponibilita();mostraDati()}catch(e){console.error("Errore inizializzazione iscrizione:",e);mostraMessaggio("❌ Errore caricamento pagina","errore")}}
function getNumeroSquadre(){let numero=0;if(torneo?.configurazione?.rules?.numeroSquadre)numero=Number(torneo.configurazione.rules.numeroSquadre);if(!numero&&torneo?.posti)numero=Number(torneo.posti);return numero||8}
function iscrizioniChiuse(){return torneo?.iscrizioni_chiuse===true||["chiuso","concluso","archiviato"].includes(String(torneo?.stato||"").toLowerCase())}
async function aggiornaDisponibilita(){if(!torneo)return;limiteCorrente=getNumeroSquadre()*2;const {data,error}=await sb.from("iscrizioni").select("id,stato").eq("torneo_id",torneo.id);if(error){console.error("Errore controllo posti:",error);return}iscrittiCorrenti=(data||[]).filter(x=>String(x.stato||"").toLowerCase()!=="rifiutato").length;if(iscrittiCorrenti>=limiteCorrente&&!torneo.iscrizioni_chiuse){const r=await sb.from("tornei").update({iscrizioni_chiuse:true,stato:"chiuso"}).eq("id",torneo.id);if(!r.error){torneo.iscrizioni_chiuse=true;torneo.stato="chiuso"}}}
function mostraDati(){const boxTorneo=document.getElementById("datiTorneo");if(!boxTorneo||!torneo)return;const giocatori=limiteCorrente||getNumeroSquadre()*2,posti=Math.max(0,giocatori-iscrittiCorrenti),chiuso=iscrizioniChiuse()||iscrittiCorrenti>=giocatori;boxTorneo.innerHTML=`<div class="info">🏆 <b>${torneo.nome||"Torneo"}</b><br><br>📅 Data: ${torneo.data||"-"}<br>🎾 Formula: ${torneo.formula||torneo.configurazione?.rules?.tipoTorneo||"Padel"}<br>👥 Iscritti: ${iscrittiCorrenti}/${giocatori} giocatori<br>🟢 Posti disponibili: ${posti}${posti>0&&posti<=3?`<br><b>🔥 ULTIMI ${posti} POSTI</b>`:""}<br><br>Stato: ${chiuso?"❌ TORNEO COMPLETO / ISCRIZIONI CHIUSE":"🟢 Iscrizioni aperte"}</div>`;const boxUtente=document.getElementById("datiUtente");if(boxUtente){boxUtente.innerHTML=profilo?`<div class="info">👤 Giocatore:<br><b>${profilo.nome||""} ${profilo.cognome||""}</b><br>📧 ${utente.email||""}</div>`:`<div class="info">👤 Utente:<br><b>${utente.email||""}</b></div>`}const btn=document.getElementById("btnConferma");if(btn){btn.disabled=chiuso;btn.textContent=chiuso?"ISCRIZIONI CHIUSE":"CONFERMA ISCRIZIONE"}}
async function confermaIscrizione(){if(!torneo||!utente){mostraMessaggio("❌ Dati torneo o utente mancanti","errore");return}await aggiornaDisponibilita();mostraDati();if(iscrizioniChiuse()||iscrittiCorrenti>=limiteCorrente){mostraMessaggio("❌ Torneo completo: non ci sono più posti disponibili","errore");return}const {data:giaIscritto,error:erroreGia}=await sb.from("iscrizioni").select("id").eq("torneo_id",torneo.id).eq("user_id",utente.id);if(erroreGia){console.error("Errore controllo iscrizione:",erroreGia);return}if(giaIscritto?.length){mostraMessaggio("⚠️ Sei già iscritto a questo torneo","errore");return}const nome=profilo?.nome||utente.email.split("@")[0],cognome=profilo?.cognome||"",alias=cognome?cognome.substring(0,6).toUpperCase():nome.substring(0,6).toUpperCase();const {error:erroreInsert}=await sb.from("iscrizioni").insert({torneo_id:torneo.id,user_id:utente.id,nome_giocatore:alias,nome,cognome,email:utente.email||"",telefono:profilo?.telefono||"",livello:profilo?.livello||"",note:profilo?.note||"",categoria:"Open",stato:"richiesta",approvato:false,data_iscrizione:new Date().toISOString()});if(erroreInsert){console.error("Errore inserimento iscrizione:",erroreInsert);mostraMessaggio("❌ Errore iscrizione: "+erroreInsert.message,"errore");return}mostraMessaggio("✅ Richiesta iscrizione inviata","successo");setTimeout(()=>{window.location.href="visitatore.html"},1500)}
function mostraMessaggio(testo,tipo){const box=document.getElementById("messaggio");if(!box)return;box.className=tipo;box.innerHTML="<p>"+testo+"</p>"}
function tornaTornei(){window.location.href="visitatore.html"}
async function avviaIscrizione(){console.log("Avvio pagina iscrizione");await inizializza();console.log("Pagina iscrizione caricata",torneo)}
window.addEventListener("load",avviaIscrizione);
</script>
<script src="torneo-flow-public-fix-v1.js?v=2"></script>
<script src="sponsor-public-v2.js?v=3"></script>
</body>
</html>
