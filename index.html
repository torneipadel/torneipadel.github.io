<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>NEXT POINT PADEL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lingue.js?v=2"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Open Sans",Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;color:#fff;background:linear-gradient(rgba(7,18,25,.28),rgba(7,18,25,.44)),url("2pages.jpg") center/cover fixed no-repeat;overflow-x:hidden}
.glass{width:min(570px,100%);min-height:640px;margin:0 auto;padding:38px 42px 32px;border:1px solid rgba(255,255,255,.22);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.055));box-shadow:0 18px 50px rgba(0,0,0,.30);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;flex-direction:column;justify-content:center}
.brand{position:relative;text-align:center;margin-bottom:25px;isolation:isolate}.brand:before{content:"";position:absolute;z-index:-1;left:50%;top:-8px;width:min(390px,92vw);height:205px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.52) 0%,rgba(0,0,0,.34) 38%,rgba(0,0,0,.14) 62%,rgba(0,0,0,0) 78%);filter:blur(10px);pointer-events:none}.brand img{position:relative;z-index:1;display:block;width:auto;max-width:300px;height:auto;max-height:155px;margin:0 auto 12px;object-fit:contain;filter:brightness(1.24) contrast(.90) saturate(.82) drop-shadow(0 0 8px rgba(255,255,255,.18)) drop-shadow(0 10px 24px rgba(0,0,0,.22));opacity:.98;transition:filter .25s ease,transform .25s ease}.brand img:hover{filter:brightness(1.30) contrast(.88) saturate(.78) drop-shadow(0 0 11px rgba(255,255,255,.25)) drop-shadow(0 12px 28px rgba(0,0,0,.18));transform:translateY(-1px)}.brand h1{position:relative;z-index:1;margin:0;font-size:22px;line-height:1.15;font-weight:700;letter-spacing:2.4px;text-shadow:0 2px 12px rgba(0,0,0,.28)}.brand p{position:relative;z-index:1;margin:8px 0 0;font-size:13px;line-height:1.5;opacity:.84;letter-spacing:.15px}
.section-title{margin:0 0 19px;font-size:20px;line-height:1.3;font-weight:600;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.20)}
label{display:block;margin:0 0 7px;font-size:13px;line-height:1.4;font-weight:600}.field{margin-bottom:16px}
input[type=email],input[type=password]{width:100%;height:48px;padding:0 16px;border:1px solid rgba(255,255,255,.25);border-radius:12px;outline:none;color:#fff;background:rgba(255,255,255,.11);box-shadow:inset 0 1px 1px rgba(255,255,255,.05);font:400 15px/1.2 "Open Sans",Arial,sans-serif;transition:.2s ease}
input::placeholder{color:rgba(255,255,255,.66)}input:focus{border-color:rgba(255,255,255,.58);background:rgba(255,255,255,.16);box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.options{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:2px 0 20px;font-size:12.5px;line-height:1.4}.remember{display:flex;align-items:center;gap:7px;margin:0;cursor:pointer}.remember input{width:auto;height:auto;margin:0;accent-color:#fff}
.link{color:#fff;text-decoration:underline;cursor:pointer;font-weight:600;text-underline-offset:2px}
button{width:100%;height:48px;border:1px solid rgba(255,255,255,.20);border-radius:11px;color:#073b72;font:800 13px/1.2 "Open Sans",Arial,sans-serif;letter-spacing:.6px;cursor:pointer;background:#fff;transition:.2s ease;box-shadow:0 7px 18px rgba(0,0,0,.10)}button:hover{background:#fff;transform:translateY(-1px);box-shadow:0 9px 22px rgba(0,0,0,.15)}.secondary{margin-top:11px;background:rgba(0,0,0,.22);color:#fff;box-shadow:none}.secondary:hover{background:rgba(0,0,0,.32)}
.register{margin-top:21px;padding-top:18px;border-top:1px solid rgba(255,255,255,.13);text-align:center;font-size:12.5px;line-height:1.5;opacity:.95}.status{min-height:20px;margin-top:14px;text-align:center;font-size:13px;line-height:1.45;color:#fff;opacity:.95}
.language-selector{position:fixed;top:18px;right:18px;z-index:1000;font-size:13px}.language-button{height:38px;min-width:76px;padding:0 12px;border:1px solid rgba(255,255,255,.28);border-radius:10px;background:rgba(7,18,25,.38);color:#fff;box-shadow:0 5px 18px rgba(0,0,0,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font:700 13px/1 "Open Sans",Arial,sans-serif;letter-spacing:.2px;cursor:pointer}.language-button:hover{background:rgba(7,18,25,.52);transform:none}.language-menu{position:absolute;right:0;top:44px;width:164px;padding:6px;border:1px solid rgba(255,255,255,.22);border-radius:12px;background:rgba(10,24,32,.88);box-shadow:0 12px 30px rgba(0,0,0,.30);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);opacity:0;visibility:hidden;transform:translateY(-5px);transition:.18s ease}.language-selector.open .language-menu{opacity:1;visibility:visible;transform:translateY(0)}.language-option{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:transparent;color:#fff;text-align:left;font:600 13px/1.2 "Open Sans",Arial,sans-serif;cursor:pointer}.language-option:hover,.language-option.active{background:rgba(255,255,255,.12)}
@media(max-width:767px){body{padding:18px 12px;align-items:center}.glass{width:min(570px,100%);min-height:calc(100dvh - 36px);padding:30px 22px 25px;border-radius:18px}.brand{margin-bottom:22px}.brand:before{top:-5px;width:min(340px,88vw);height:175px}.brand img{max-width:250px;max-height:130px}.brand h1{font-size:20px;letter-spacing:2px}.brand p{font-size:12.5px}.section-title{font-size:18px}label{font-size:13px}input[type=email],input[type=password]{height:46px;font-size:15px}.options{font-size:12.5px}button{height:46px;font-size:13px}.register{font-size:12.5px}.status{font-size:13px}.language-selector{top:12px;right:12px}.language-button{height:36px;min-width:72px}.language-menu{top:42px}}
@media(max-width:380px){body{padding:14px 10px;align-items:center}.glass{min-height:calc(100dvh - 28px);padding:25px 18px 22px;border-radius:16px}.brand{margin-bottom:19px}.brand:before{top:-3px;width:300px;height:155px}.brand img{max-width:215px;max-height:112px;margin-bottom:10px}.brand h1{font-size:19px;letter-spacing:1.7px}.brand p{font-size:12px}.section-title{font-size:17px}.options{align-items:flex-start;flex-direction:column;gap:8px;margin-bottom:18px}.language-selector{top:10px;right:10px}.language-menu{width:154px}}
</style>
</head>
<body>
<div class="language-selector" id="languageSelector" aria-label="Lingua">
<button type="button" class="language-button"><span class="language-current">🇮🇹 IT ▾</span></button>
<div class="language-menu">
<button type="button" class="language-option active" data-lang="it">🇮🇹 <span>Italiano</span></button>
<button type="button" class="language-option" data-lang="en">🇺🇸 <span>English</span></button>
<button type="button" class="language-option" data-lang="fr">🇫🇷 <span>Français</span></button>
<button type="button" class="language-option" data-lang="es">🇪🇸 <span>Español</span></button>
<button type="button" class="language-option" data-lang="de">🇩🇪 <span>Deutsch</span></button>
</div>
</div>
<main class="glass">
<div class="brand"><img src="logo_bianco.png" alt="NEXT POINT PADEL"><h1>NEXT POINT PADEL</h1><p data-i18n="brandSub">Tornei • Eventi • Competizioni di padel</p></div>
<h2 class="section-title" data-i18n="access">Accesso utenti</h2>
<form id="loginForm" onsubmit="return false">
<div class="field"><label for="email" data-i18n="emailLabel">Email</label><input id="email" type="email" autocomplete="email" placeholder="Inserisci la tua email" data-i18n-placeholder="emailPlaceholder"></div>
<div class="field"><label for="password" data-i18n="passwordLabel">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Inserisci la tua password" data-i18n-placeholder="passwordPlaceholder"></div>
<div class="options"><label class="remember"><input id="ricordami" type="checkbox"><span data-i18n="remember">Ricordami</span></label><span class="link" id="forgotPassword" data-i18n="forgot">Password dimenticata?</span></div>
<button type="button" id="loginBtn" data-i18n="login">ACCEDI</button>
<button type="button" class="secondary" id="registerBtn" data-i18n="register">REGISTRATI</button>
</form>
<div class="register"><span data-i18n="notRegistered">Non sei iscritto?</span> <span class="link" id="registerLink" data-i18n="registerLink">Registrati</span></div>
<div id="status" class="status"></div>
</main>
<script>
const sb=supabase.createClient("https://iybjvtmfaupgthqqsngd.supabase.co","sb_publishable_oLLML3_ne0I1dWKIinSRNA_K1Ao5SOl",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const status=document.getElementById("status");
const emailInput=document.getElementById("email");
const passwordInput=document.getElementById("password");
const loginBtn=document.getElementById("loginBtn");
const registerBtn=document.getElementById("registerBtn");
const registerLink=document.getElementById("registerLink");
const forgotPassword=document.getElementById("forgotPassword");
function tr(key){return window.NextPointLanguage?window.NextPointLanguage.getText(key):key}
async function registerUser(){const email=emailInput.value.trim();const password=passwordInput.value;if(!email||!password){status.innerHTML=tr("enterCredentials");return}status.innerHTML=tr("registering");const {error}=await sb.auth.signUp({email,password});if(error){status.innerHTML="Errore: "+error.message;return}status.innerHTML=tr("registered")}
async function loginUser(){const email=emailInput.value.trim();const password=passwordInput.value;if(!email||!password){status.innerHTML=tr("enterCredentials");return}status.innerHTML=tr("accessing");const {error}=await sb.auth.signInWithPassword({email,password});if(error){status.innerHTML=error.message;return}window.location.href="2Page.html"}
async function resetPassword(){const email=emailInput.value.trim();if(!email){status.innerHTML=tr("enterEmail");return}status.innerHTML=tr("resetSending");const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+"/reset-password.html"});if(error){status.innerHTML="Errore: "+error.message;return}status.innerHTML=tr("resetSent")}
loginBtn.addEventListener("click",loginUser);registerBtn.addEventListener("click",registerUser);registerLink.addEventListener("click",registerUser);forgotPassword.addEventListener("click",resetPassword);document.getElementById("loginForm").addEventListener("submit",function(){loginUser()});
sb.auth.onAuthStateChange(function(event,session){});
</script>
</body>
</html>
