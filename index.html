<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Next Point Padel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg-image:url('2pages.jpg');--blue:#004a99;--gold:#ffeb3b;--glass:rgba(255,255,255,0.15);--border:rgba(255,255,255,0.25)}
*{box-sizing:border-box}
body{margin:0;background-image:var(--bg-image);background-size:cover;background-position:center;background-attachment:fixed;font-family:sans-serif;color:white;min-height:100vh;padding:90px 20px 40px}
.box{width:350px;max-width:100%;margin:0 auto;padding:30px;border-radius:25px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,.4);text-align:center}
.logo{width:140px;margin-bottom:10px}.club-name{margin-top:5px;font-size:28px;font-weight:bold}.subtitle{font-size:13px;opacity:.9;margin-bottom:20px}.title-login{font-size:22px;font-weight:600;margin:15px 0}
input{width:100%;padding:13px;margin:8px 0;border:none;border-radius:10px;font-size:13px;font-family:sans-serif;color:#333;background:white}input:focus{outline:2px solid rgba(255,255,255,.35)}
.remember{display:flex;align-items:center;justify-content:flex-start;gap:8px;font-size:13px;margin:12px 0;color:white}.remember input{width:auto;margin:0}
.link{color:white;font-size:13px;cursor:pointer;text-decoration:none;margin:8px 0;display:block}.link:hover{text-decoration:underline}
.buttons{display:flex;gap:10px;margin-top:12px}.btn{width:100%;padding:13px;border:none;border-radius:10px;cursor:pointer;font-weight:bold;background:white;color:#004a99;font-size:15px;font-family:sans-serif}.btn:hover{opacity:.85}
#status{margin-top:15px;min-height:20px;color:var(--gold);font-size:14px}
@media(min-width:601px){body{padding:70px 30px 50px}.box{width:600px;padding:38px 44px;border-radius:28px}.logo{width:160px;margin-bottom:14px}.club-name{font-size:32px}.subtitle{font-size:14px;margin-bottom:24px}.title-login{font-size:24px;margin:18px 0}input{padding:14px;font-size:14px}.remember,.link{font-size:14px}.btn{padding:14px;font-size:14px}}
@media(max-width:600px){body{padding:58px 10px 25px}.box{width:100%;max-width:390px;padding:18px 14px 16px;border-radius:22px}.logo{width:105px;margin-bottom:3px}.club-name{font-size:21px;margin:3px 0 5px}.subtitle{font-size:11px;margin-bottom:8px}.title-login{font-size:21px;margin:8px 0}.remember,.link{font-size:12px}.btn{padding:10px 5px;font-size:12px}}
</style>
</head>
<body>
<div class="box">
<img src="logo.jpg" class="logo" alt="Next Point Padel">
<div class="club-name">NEXT POINT PADEL</div>
<div class="subtitle">Tornei • Eventi • Competizioni di padel</div>
<div class="title-login">Accesso utenti</div>
<input id="email" type="email" placeholder="Email o cellulare" autocomplete="username">
<input id="password" type="password" placeholder="Password" autocomplete="current-password">
<label class="remember"><input id="ricordami" type="checkbox">Resta connesso</label>
<a class="link" onclick="resetPassword()">Hai dimenticato la password?</a>
<div class="buttons"><button class="btn" id="loginBtn" type="button">ACCEDI</button><button class="btn" id="registerBtn" type="button">REGISTRATI</button></div>
<div class="link">Non sei iscritto? Registrati</div>
<div id="status"></div>
</div>
<script>
const sb=supabase.createClient("https://iybjvtmfaupgthqqsngd.supabase.co","sb_publishable_oLLML3_ne0I1dWKIinSRNA_K1Ao5SOl",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const status=document.getElementById("status");
document.getElementById("registerBtn").addEventListener("click",async()=>{const email=document.getElementById("email").value.trim();const password=document.getElementById("password").value;if(!email||!password){status.innerHTML="Inserisci email e password";return}status.innerHTML="Registrazione in corso...";const {error}=await sb.auth.signUp({email,password});if(error){status.innerHTML="Errore: "+error.message;return}status.innerHTML="Registrazione completata. Ora puoi accedere."});
document.getElementById("loginBtn").addEventListener("click",async()=>{const email=document.getElementById("email").value.trim();const password=document.getElementById("password").value;if(!email||!password){status.innerHTML="Inserisci email e password";return}status.innerHTML="Accesso in corso...";const {error}=await sb.auth.signInWithPassword({email,password});if(error){status.innerHTML=error.message;return}window.location.href="2Page.html"});
async function resetPassword(){const email=document.getElementById("email").value.trim();if(!email){status.innerHTML="Inserisci prima la tua email";return}status.innerHTML="Invio richiesta reset password...";const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+"/reset-password.html"});if(error){status.innerHTML="Errore: "+error.message;return}status.innerHTML="✅ Controlla la tua email per reimpostare la password"}
</script>
</body>
</html>
