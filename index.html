<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>NEXT POINT PADEL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Open Sans",Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#fff;background:linear-gradient(rgba(7,18,25,.28),rgba(7,18,25,.42)),url("2pages.jpg") center/cover fixed no-repeat}
.glass{width:min(600px,100%);padding:34px 34px 30px;border:1px solid rgba(255,255,255,.24);border-radius:28px;background:rgba(255,255,255,.12);box-shadow:0 20px 55px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.16);backdrop-filter:blur(18px) saturate(125%);-webkit-backdrop-filter:blur(18px) saturate(125%)}
.brand{text-align:center;margin-bottom:28px}.brand img{display:block;width:auto;max-width:260px;height:auto;max-height:132px;margin:0 auto 14px;object-fit:contain;filter:brightness(1.24) contrast(.90) saturate(.82) drop-shadow(0 0 7px rgba(255,255,255,.18)) drop-shadow(0 8px 20px rgba(0,0,0,.20));opacity:.97;transition:filter .25s ease,transform .25s ease}.brand img:hover{filter:brightness(1.30) contrast(.88) saturate(.78) drop-shadow(0 0 10px rgba(255,255,255,.25)) drop-shadow(0 10px 24px rgba(0,0,0,.18));transform:translateY(-1px)}.brand h1{margin:0;font-size:28px;font-weight:700;letter-spacing:2px;text-shadow:0 2px 12px rgba(0,0,0,.28)}.brand p{margin:8px 0 0;font-size:13px;opacity:.9}
.section-title{margin:0 0 16px;font-size:18px;font-weight:600;text-align:center}
label{display:block;margin:0 0 7px;font-size:13px;font-weight:600}.field{margin-bottom:15px}
input[type=email],input[type=password]{width:100%;height:46px;padding:0 15px;border:1px solid rgba(255,255,255,.25);border-radius:12px;outline:none;color:#fff;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 1px rgba(255,255,255,.05)}
input::placeholder{color:rgba(255,255,255,.68)}input:focus{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.16)}
.options{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 20px;font-size:12px}.remember{display:flex;align-items:center;gap:7px;margin:0;cursor:pointer}.remember input{width:auto;height:auto;margin:0;accent-color:#fff}
.link{color:#fff;text-decoration:underline;cursor:pointer;font-weight:600}
button{width:100%;height:46px;border:1px solid rgba(255,255,255,.28);border-radius:12px;color:#fff;font-weight:700;letter-spacing:.4px;cursor:pointer;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:.2s ease}button:hover{background:rgba(255,255,255,.28);transform:translateY(-1px)}.secondary{margin-top:10px;background:rgba(255,255,255,.08)}
.register{margin-top:22px;padding-top:20px;border-top:1px solid rgba(255,255,255,.16);text-align:center;font-size:13px}.status{min-height:20px;margin-top:15px;text-align:center;font-size:12px;color:#fff;opacity:.95}
@media(max-width:520px){body{padding:16px}.glass{padding:28px 22px 24px;border-radius:25px}.brand img{max-width:220px;max-height:112px}.brand h1{font-size:24px}}
</style>
</head>
<body>
<main class="glass">
<div class="brand"><img src="logo_bianco.png" alt="NEXT POINT PADEL"><h1>NEXT POINT PADEL</h1><p>Tornei • Eventi • Competizioni di padel</p></div>
<h2 class="section-title">Accesso utenti</h2>
<form id="loginForm" onsubmit="return false">
<div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="Inserisci la tua email"></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Inserisci la password"></div>
<div class="options"><label class="remember"><input id="ricordami" type="checkbox"><span>Ricordami</span></label><span class="link" id="forgotPassword">Password dimenticata?</span></div>
<button type="button" id="loginBtn">ACCEDI</button>
<button type="button" class="secondary" id="registerBtn">REGISTRATI</button>
</form>
<div class="register">Non sei iscritto? <span class="link" id="registerLink">Registrati</span></div>
<div id="status" class="status"></div>
</main>
<script>
const sb=supabase.createClient("https://iybjvtmfaupgthqqsngd.supabase.co","sb_publishable_oLLML3_ne0I1dWKIinSRNA_K1Ao5SOl",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const status=document.getElementById("status");
const emailInput=document.getElementById("email");
const passwordInput=document.getElementById("password");
const loginBtn=document.getElementById("loginBtn");
const registerBtn=document.getElementById("registerBtn");
const registerLink=document.getElementById("registerLink");
const forgotPassword=document.getElementById("forgotPassword");
async function registerUser(){const email=emailInput.value.trim();const password=passwordInput.value;if(!email||!password){status.innerHTML="Inserisci email e password";return}status.innerHTML="Registrazione in corso...";const {error}=await sb.auth.signUp({email,password});if(error){status.innerHTML="Errore: "+error.message;return}status.innerHTML="Registrazione completata. Ora puoi accedere."}
async function loginUser(){const email=emailInput.value.trim();const password=passwordInput.value;if(!email||!password){status.innerHTML="Inserisci email e password";return}status.innerHTML="Accesso in corso...";const {error}=await sb.auth.signInWithPassword({email,password});if(error){status.innerHTML=error.message;return}window.location.href="2Page.html"}
async function resetPassword(){const email=emailInput.value.trim();if(!email){status.innerHTML="Inserisci prima la tua email";return}status.innerHTML="Invio richiesta reset password...";const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+"/reset-password.html"});if(error){status.innerHTML="Errore: "+error.message;return}status.innerHTML="Controlla la tua email per reimpostare la password"}
loginBtn.addEventListener("click",loginUser);registerBtn.addEventListener("click",registerUser);registerLink.addEventListener("click",registerUser);forgotPassword.addEventListener("click",resetPassword);document.getElementById("loginForm").addEventListener("submit",function(){loginUser()});
sb.auth.onAuthStateChange(function(event,session){});
</script>
</body>
</html>
