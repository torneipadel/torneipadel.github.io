<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>News | Next Point Padel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--glass:rgba(255,255,255,.54);--glass-strong:rgba(255,255,255,.68);--glass-soft:rgba(255,255,255,.38);--line:rgba(255,255,255,.72);--text:#152033;--muted:#5f6b7a;--accent:#0f766e;--accent-dark:#0b5f59;--shadow:0 24px 70px rgba(15,23,42,.18);--shadow-soft:0 12px 34px rgba(15,23,42,.12)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Open Sans',Arial,sans-serif;color:var(--text)}
body{position:relative;min-height:100vh;background:url('sfondo2.jpg') center/cover fixed no-repeat;padding:28px 18px 54px;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.34),rgba(226,232,240,.18));pointer-events:none;z-index:0}
body:after{content:"";position:fixed;width:520px;height:520px;right:-220px;top:-210px;border-radius:50%;background:rgba(255,255,255,.22);filter:blur(4px);pointer-events:none;z-index:0}
.page{position:relative;z-index:1;max-width:1180px;margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand{font-weight:800;letter-spacing:.12em;font-size:23px;color:#fff;text-shadow:0 2px 18px rgba(15,23,42,.28)}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);background:rgba(255,255,255,.56);border:1px solid rgba(255,255,255,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:10px 16px;border-radius:999px;box-shadow:var(--shadow-soft);font-size:13px;font-weight:700;transition:transform .2s ease,background .2s ease,box-shadow .2s ease}.back:hover{transform:translateY(-2px);background:rgba(255,255,255,.72);box-shadow:0 16px 38px rgba(15,23,42,.16)}
.heroTitle{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.68),rgba(255,255,255,.42));border:1px solid var(--line);border-radius:30px;padding:28px 32px;box-shadow:var(--shadow);backdrop-filter:blur(24px) saturate(135%);-webkit-backdrop-filter:blur(24px) saturate(135%);margin-bottom:22px}.heroTitle:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.28),transparent 45%);pointer-events:none}.heroTitle>*{position:relative}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--accent-dark);font-weight:800}.heroTitle h1{margin:7px 0 6px;font-size:40px;line-height:1.05;letter-spacing:-.03em}.heroTitle p{margin:0;color:var(--muted);font-size:14px}
.featured{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.70),rgba(255,255,255,.43));border:1px solid var(--line);border-radius:30px;overflow:hidden;box-shadow:var(--shadow);backdrop-filter:blur(25px) saturate(135%);-webkit-backdrop-filter:blur(25px) saturate(135%);margin-bottom:22px}.featuredMedia{width:100%;min-height:260px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.45)}.featuredMedia img{width:100%;height:auto;max-height:650px;object-fit:contain;display:block}.featuredNoImage{min-height:240px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;font-size:14px}.featuredBody{padding:28px 32px 32px}.badge{display:inline-flex;width:max-content;padding:7px 11px;border-radius:999px;background:rgba(15,118,110,.12);border:1px solid rgba(15,118,110,.15);color:var(--accent-dark);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em}.featuredBody h2{font-size:36px;line-height:1.08;letter-spacing:-.025em;margin:14px 0 8px}.date{color:var(--muted);font-size:12px;margin-bottom:16px}.text{white-space:pre-line;color:#344054;line-height:1.75;max-width:900px;font-size:14px}.cta{display:inline-flex;align-items:center;width:max-content;margin-top:21px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;text-decoration:none;padding:11px 17px;border-radius:13px;font-size:13px;font-weight:800;box-shadow:0 10px 24px rgba(15,118,110,.22);transition:transform .2s ease,box-shadow .2s ease}.cta:hover{transform:translateY(-2px);box-shadow:0 15px 30px rgba(15,118,110,.28)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}.filter{border:1px solid rgba(255,255,255,.68);background:rgba(255,255,255,.48);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);padding:8px 14px;border-radius:999px;cursor:pointer;color:#344054;font-size:12px;font-weight:700;box-shadow:0 7px 18px rgba(15,23,42,.07);transition:transform .2s ease,background .2s ease,color .2s ease}.filter:hover{transform:translateY(-1px);background:rgba(255,255,255,.66)}.filter.active{background:rgba(21,32,51,.88);color:#fff;border-color:rgba(255,255,255,.18);box-shadow:0 9px 22px rgba(15,23,42,.18)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.64),rgba(255,255,255,.39));border:1px solid rgba(255,255,255,.68);border-radius:24px;overflow:hidden;box-shadow:var(--shadow-soft);backdrop-filter:blur(20px) saturate(125%);-webkit-backdrop-filter:blur(20px) saturate(125%);display:flex;flex-direction:column;transition:transform .24s ease,box-shadow .24s ease,border-color .24s ease}.card:hover{transform:translateY(-5px);box-shadow:0 20px 44px rgba(15,23,42,.17);border-color:rgba(255,255,255,.9)}.cardMedia{aspect-ratio:16/10;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.42)}.cardMedia img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}.card:hover .cardMedia img{transform:scale(1.025)}.cardBody{padding:19px 19px 21px;display:flex;flex-direction:column;flex:1}.cardBody h3{margin:8px 0 8px;font-size:20px;line-height:1.2;letter-spacing:-.015em}.cardBody p{margin:0;color:#536070;line-height:1.6;font-size:13px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.cardBody .cta{margin-top:auto;align-self:flex-start}.smallDate{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.01em}.empty{background:rgba(255,255,255,.58);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:26px;padding:38px;text-align:center;color:var(--muted);box-shadow:var(--shadow-soft)}.loading{text-align:center;padding:54px;color:#fff;text-shadow:0 2px 12px rgba(15,23,42,.25);font-weight:700}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.heroTitle h1{font-size:32px}.featuredBody h2{font-size:30px}}
@media(max-width:560px){body{padding:15px 10px 36px;background-attachment:scroll}.top{align-items:flex-start}.brand{font-size:17px;letter-spacing:.08em}.back{padding:9px 13px;font-size:12px}.heroTitle{padding:22px;border-radius:24px}.heroTitle h1{font-size:30px}.heroTitle p{font-size:13px}.featured{border-radius:24px}.featuredMedia{min-height:190px}.featuredBody{padding:22px 20px 24px}.featuredBody h2{font-size:27px}.grid{grid-template-columns:1fr}.card{border-radius:22px}.featuredMedia img{max-height:none}.filters{gap:7px}.filter{padding:8px 12px}}
@media(prefers-reduced-motion:reduce){.back,.cta,.filter,.card,.cardMedia img{transition:none}}
</style>
</head>
<body>
<div class="page">
<div class="top"><div class="brand">NEXT POINT PADEL</div><a class="back" href="2Page.html">← Torna al sito</a></div>
<section class="heroTitle"><div class="eyebrow">Comunicazioni & contenuti</div><h1>News</h1><p>Tornei, promozioni, eventi, ricordi e novità del club.</p></section>
<main id="app"><div class="loading">Caricamento delle News…</div></main>
</div>
<script>
const SUPABASE_URL='https://iybjvtmfaupgthqqsngd.supabase.co';
const SUPABASE_KEY='sb_publishable_oLLML3_ne0I1dWKIinSRNA_K1Ao5SOl';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let allNews=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function normalizeNews(row){const cfg=row?.configurazione||{};const arr=Array.isArray(cfg.news)?cfg.news:[];return arr.map((n,i)=>({...n,__torneo:row.nome||'',__torneoId:row.id,__index:i,__ordine:Number(n.ordine)||999999,__data:n.data||row.updated_at||row.data_torneo||row.data||''}))}
function formatDate(v){if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'})}
function sortNews(a,b){if(Boolean(b.inEvidenza)!==Boolean(a.inEvidenza))return b.inEvidenza?1:-1;if(a.__ordine!==b.__ordine)return a.__ordine-b.__ordine;return String(b.__data).localeCompare(String(a.__data))}
function imageTag(src,alt,cls){return src?`<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}" loading="lazy">`:''}
function render(list=allNews){const app=document.getElementById('app');if(!list.length){app.innerHTML='<div class="empty">Non ci sono News pubblicate al momento.</div>';return}const featured=list.find(n=>n.inEvidenza)||list[0];const cats=['Tutte',...new Set(list.map(n=>n.tipo||'Comunicazione'))];const cards=list.filter(n=>n!==featured);app.innerHTML=`<section class="featured"><div class="featuredMedia">${featured.immagine?imageTag(featured.immagine,featured.titolo||'Locandina',''): '<div class="featuredNoImage">News in evidenza</div>'}</div><div class="featuredBody"><span class="badge">${esc(featured.tipo||'Comunicazione')}</span><h2>${esc(featured.titolo||'Senza titolo')}</h2><div class="date">${esc(formatDate(featured.__data))}${featured.__torneo?' · '+esc(featured.__torneo):''}</div><div class="text">${esc(featured.testo||'')}</div>${featured.link?`<a class="cta" href="${esc(featured.link)}" target="_blank" rel="noopener">Scopri di più →</a>`:''}</div></section><div class="filters">${cats.map((c,i)=>`<button class="filter ${i===0?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div><section class="grid" id="newsGrid">${cards.map(cardHtml).join('')}</section>`;document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const cat=btn.dataset.cat;document.getElementById('newsGrid').innerHTML=list.filter(n=>n!==featured&&(cat==='Tutte'||(n.tipo||'Comunicazione')===cat)).map(cardHtml).join('')}))}
function cardHtml(n){return `<article class="card">${n.immagine?`<div class="cardMedia">${imageTag(n.immagine,n.titolo||'News','')}</div>`:''}<div class="cardBody"><span class="smallDate">${esc(n.tipo||'Comunicazione')} · ${esc(formatDate(n.__data))}</span><h3>${esc(n.titolo||'Senza titolo')}</h3><p>${esc(n.testo||'')}</p>${n.link?`<a class="cta" href="${esc(n.link)}" target="_blank" rel="noopener">Apri →</a>`:''}</div></article>`}
async function load(){const {data,error}=await sb.from('tornei').select('id,nome,data,data_torneo,updated_at,configurazione').order('updated_at',{ascending:false});if(error){document.getElementById('app').innerHTML='<div class="empty">Le News non sono momentaneamente disponibili.</div>';console.error(error);return}allNews=(data||[]).flatMap(normalizeNews).filter(n=>n.titolo||n.immagine||n.testo).sort(sortNews);render(allNews)}
load();
</script>
</body>
</html>
