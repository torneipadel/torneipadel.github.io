<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mercatino · Next Point Padel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--white:rgba(255,255,255,.86);--line:rgba(255,255,255,.22);--panel:rgba(255,255,255,.10);--dark:#071321;--blue:#073b72;--gold:#ffe76b}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:'Open Sans',Arial,sans-serif;color:#fff;background:#06111f url('sfondo2.jpg') center/cover fixed no-repeat;overflow-x:hidden}
body:before{content:'';position:fixed;inset:0;background:linear-gradient(180deg,rgba(3,12,24,.30),rgba(3,12,24,.68));pointer-events:none;z-index:-1}
.page{width:min(760px,calc(100% - 28px));margin:auto;padding:18px 0 45px}
.topbar{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:18px;background:rgba(4,15,29,.50);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 35px rgba(0,0,0,.22);position:sticky;top:12px;z-index:20}
.icon{width:40px;height:40px;border:1px solid rgba(255,255,255,.18);border-radius:11px;background:rgba(255,255,255,.09);color:#fff;font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.logo{width:112px;height:auto;display:block}
.title{margin:30px 3px 18px}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
h1{font-size:clamp(32px,7vw,48px);line-height:1;margin:8px 0 10px;letter-spacing:-.04em}
.subtitle{margin:0;color:rgba(255,255,255,.66);font-size:13px;line-height:1.6;max-width:620px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 12px;flex-wrap:wrap}
.filters{display:flex;gap:7px;flex-wrap:wrap}
.filter{border:1px solid rgba(255,255,255,.17);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:8px 11px;font:700 10px 'Open Sans';cursor:pointer}
.filter.active,.filter:hover{background:#fff;color:var(--blue)}
.note{font-size:10px;color:rgba(255,255,255,.52)}
.list{display:grid;gap:10px}
.empty{padding:30px 18px;border:1px dashed rgba(255,255,255,.22);border-radius:20px;background:rgba(255,255,255,.06);text-align:center;color:rgba(255,255,255,.62);font-size:12px}
.item{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;padding:12px;border:1px solid rgba(255,255,255,.18);border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.055));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 14px 38px rgba(0,0,0,.18)}
.thumb{width:110px;height:92px;border-radius:14px;background:linear-gradient(135deg,#0a3159,#061321);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:30px;color:rgba(255,255,255,.35)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.type{font-size:9px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold)}
.item h2{font-size:17px;margin:5px 0 5px;text-align:left}
.item p{font-size:11px;color:rgba(255,255,255,.62);margin:0;line-height:1.45}
.price{font-size:16px;font-weight:800;white-space:nowrap;margin-top:8px}
.condition{font-size:9px;color:rgba(255,255,255,.52);margin-top:4px}
.open{height:34px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.20);background:#fff;color:var(--blue);font:800 9px 'Open Sans';cursor:pointer;white-space:nowrap}
.open:hover{transform:translateY(-1px)}
.detail{position:fixed;inset:0;background:rgba(2,9,17,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}
.detail.opened{display:flex}
.detail-box{width:min(620px,100%);max-height:calc(100vh - 36px);overflow:auto;border:1px solid rgba(255,255,255,.22);border-radius:26px;background:rgba(7,19,33,.94);box-shadow:0 30px 90px rgba(0,0,0,.42);padding:18px}
.detail-head{display:flex;justify-content:flex-end}
.close{width:34px;height:34px;border:1px solid rgba(255,255,255,.16);border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-size:20px;cursor:pointer}
.detail-photo{height:260px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#0a3159,#061321);display:flex;align-items:center;justify-content:center;font-size:70px;color:rgba(255,255,255,.25)}
.detail-photo img{width:100%;height:100%;object-fit:cover}
.detail h2{font-size:27px;margin:18px 0 7px;text-align:left}
.detail-text{font-size:12px;line-height:1.65;color:rgba(255,255,255,.68);white-space:pre-line}
.detail-meta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.pill{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);font-size:10px}
.contact{display:inline-flex;align-items:center;justify-content:center;margin-top:14px;min-height:36px;padding:0 14px;border-radius:10px;background:#fff;color:var(--blue);font:800 10px 'Open Sans';text-decoration:none}
.footer{text-align:center;padding:30px 0 5px;color:rgba(255,255,255,.42);font-size:9px;letter-spacing:1.4px;text-transform:uppercase}
@media(max-width:600px){body{background-attachment:scroll}.page{width:calc(100% - 20px);padding-top:10px}.topbar{top:7px}.logo{width:94px}.title{margin-top:25px}.item{grid-template-columns:76px 1fr;gap:11px}.thumb{width:76px;height:76px}.item .open-wrap{grid-column:2}.open{width:100%}.price{font-size:15px}.detail-photo{height:210px}}
</style>
</head>
<body>
<main class="page">
<header class="topbar"><button class="icon" onclick="history.back()" aria-label="Torna indietro">←</button><img class="logo" src="logo_bianco.png" alt="Next Point Padel"></header>
<section class="title"><div class="eyebrow">NEXT POINT PADEL · BACHECA INTERNA</div><h1>Mercatino</h1><p class="subtitle">Articoli sportivi, racchette e accessori messi in vendita all'interno del circolo.</p></section>
<div class="toolbar"><div class="filters"><button class="filter active" data-filter="all">Tutti</button><button class="filter" data-filter="racchette">Racchette</button><button class="filter" data-filter="abbigliamento">Abbigliamento</button><button class="filter" data-filter="accessori">Accessori</button></div><span class="note">Bacheca interna · non è un e-commerce</span></div>
<section id="list" class="list" aria-live="polite"><div class="empty">Nessun articolo pubblicato al momento.</div></section>
<footer class="footer">NEXT POINT PADEL · MERCATINO INTERNO</footer>
</main>
<div id="detail" class="detail" role="dialog" aria-modal="true" aria-label="Dettaglio articolo"><div class="detail-box"><div class="detail-head"><button class="close" onclick="closeDetail()" aria-label="Chiudi">×</button></div><div id="detailContent"></div></div></div>
<script>
(function(){
'use strict';
const items=[];
const list=document.getElementById('list');
const detail=document.getElementById('detail');
const detailContent=document.getElementById('detailContent');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function render(filter){
 const data=filter==='all'?items:items.filter(x=>x.categoria===filter);
 if(!data.length){list.innerHTML='<div class="empty">Nessun articolo disponibile in questa categoria.</div>';return}
 list.innerHTML=data.map((x,i)=>'<article class="item"><div class="thumb">'+(x.immagine?'<img src="'+esc(x.immagine)+'" alt="'+esc(x.titolo)+'">':'🎾')+'</div><div><div class="type">'+esc(x.categoriaLabel)+'</div><h2>'+esc(x.titolo)+'</h2><p>'+esc(x.anteprima)+'</p><div class="price">'+esc(x.prezzo)+'</div><div class="condition">'+esc(x.condizioni)+'</div></div><div class="open-wrap"><button class="open" onclick="openDetail('+i+')">VEDI</button></div></article>').join('');
}
window.openDetail=function(index){const x=items[index];if(!x)return;detailContent.innerHTML='<div class="detail-photo">'+(x.immagine?'<img src="'+esc(x.immagine)+'" alt="'+esc(x.titolo)+'">':'🎾')+'</div><div class="type">'+esc(x.categoriaLabel)+'</div><h2>'+esc(x.titolo)+'</h2><div class="detail-meta"><span class="pill">'+esc(x.prezzo)+'</span><span class="pill">'+esc(x.condizioni)+'</span></div><div class="detail-text">'+esc(x.descrizione)+'</div>'+(x.contatto?'<a class="contact" href="mailto:'+encodeURIComponent(x.contatto)+'">CONTATTA IL VENDITORE</a>':'');detail.classList.add('opened');};
window.closeDetail=function(){detail.classList.remove('opened')};
detail.addEventListener('click',e=>{if(e.target===detail)closeDetail()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});
document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render(btn.dataset.filter)}));
render('all');
})();
</script>
<script src="mercatino-public-v1.js?v=1"></script>
</body>
</html>
