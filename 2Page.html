<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Principale</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg-image:url('2pages.jpg');--blue:#073b72;--gold:#ffe76b;--glass:rgba(255,255,255,.12);--border:rgba(255,255,255,.22)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'Open Sans',Arial,sans-serif;color:#fff}
body{background:linear-gradient(rgba(3,12,24,.30),rgba(3,12,24,.62)),var(--bg-image) center/cover fixed no-repeat;min-height:100vh;padding:24px 14px 45px}
.box{width:min(600px,100%);margin:0 auto;padding:26px 28px 25px;border-radius:28px;background:rgba(255,255,255,.12);backdrop-filter:blur(18px) saturate(125%);-webkit-backdrop-filter:blur(18px) saturate(125%);border:1px solid rgba(255,255,255,.24);box-shadow:0 20px 55px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.16);text-align:center}
.logo{display:block;width:180px;margin:0 auto 12px;padding:0;border:0;border-radius:0;background:none;box-shadow:none;filter:brightness(1.24) contrast(.90) saturate(.82) drop-shadow(0 0 7px rgba(255,255,255,.18)) drop-shadow(0 8px 20px rgba(0,0,0,.20));opacity:.97;transition:filter .25s ease,transform .25s ease}.logo:hover{filter:brightness(1.30) contrast(.88) saturate(.78) drop-shadow(0 0 10px rgba(255,255,255,.25)) drop-shadow(0 10px 24px rgba(0,0,0,.18));transform:translateY(-1px)}
h2{font-size:24px;line-height:1.12;margin:5px 0 6px;letter-spacing:-.02em}.email{font-size:12px;line-height:1.5;color:rgba(255,255,255,.65);margin-bottom:18px}
.btn{width:100%;margin-top:10px;min-height:38px;padding:0 12px;border:1px solid rgba(255,255,255,.18);border-radius:10px;cursor:pointer;font:800 9px 'Open Sans';letter-spacing:.45px;background:#fff;color:var(--blue);box-shadow:0 7px 18px rgba(0,0,0,.12);transition:.2s}.btn:hover{transform:translateY(-1px);filter:brightness(1.04)}
.logout{width:100%;margin-top:14px;min-height:36px;padding:0 12px;border:1px solid rgba(255,255,255,.16);border-radius:10px;cursor:pointer;font:800 9px 'Open Sans';letter-spacing:.45px;background:rgba(255,255,255,.09);color:#fff}.logout:hover{background:rgba(255,255,255,.15)}
#status{margin-top:10px;min-height:15px;color:var(--gold);font-size:10px}.hidden{display:none}
.menu-button{position:fixed;top:18px;right:18px;width:38px;height:38px;border:1px solid rgba(255,255,255,.18);border-radius:11px;background:rgba(255,255,255,.09);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;font:20px/1 'Open Sans';display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1000}.menu-button:hover{background:rgba(255,255,255,.15)}
.menu-panel{position:fixed;top:0;right:-280px;width:260px;height:100vh;background:rgba(255,255,255,.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-left:1px solid rgba(255,255,255,.20);box-shadow:-8px 0 32px rgba(0,0,0,.15);transition:.3s;padding-top:70px;z-index:999}.menu-panel.open{right:0}.menu-item{padding:13px 20px;font-size:12px;font-weight:700;letter-spacing:.2px;text-align:left;cursor:pointer;color:#fff}.menu-item:hover{background:rgba(255,255,255,.15)}
.card-section{margin-top:9px;padding:0}.card-section h3{font-size:11px;margin:0 0 4px}.card-section p{font-size:10px;line-height:1.45;color:rgba(255,255,255,.55);margin:0 0 7px}
#userMenu{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.sponsor-banner{width:100%;height:126px;margin:18px auto 0;border-radius:18px;overflow:hidden;position:relative;background:rgba(255,255,255,.07);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.20);box-shadow:0 6px 24px rgba(0,0,0,.22)}.sponsor-title{height:29px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.sponsor-window{height:97px;overflow:hidden;position:relative}.sponsor-track{height:100%;display:flex;width:max-content;align-items:center;gap:12px;padding:5px 10px 10px;animation:sponsorScroll 18s linear infinite}.sponsor-slide{width:235px;height:75px;flex:none;border-radius:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.20);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.14);text-decoration:none;color:white}.sponsor-slide strong{font-size:17px;letter-spacing:1px}.sponsor-slide span{font-size:9px;opacity:.78;margin-top:4px}.sponsor-empty{height:75px;display:flex;align-items:center;justify-content:center;width:100%;font-size:10px;opacity:.8;padding:0 12px}@keyframes sponsorScroll{from{transform:translateX(0)}to{transform:translateX(calc(-50% - 6px))}}
@media(max-width:600px){body{padding:16px 10px 28px}.box{width:100%;max-width:390px;padding:20px 16px 18px;border-radius:24px}.logo{width:155px;margin-bottom:8px}h2{font-size:22px}.email{font-size:11px;margin-bottom:14px}#userMenu{grid-template-columns:1fr 1fr;gap:7px}.card-section{margin-top:4px}.card-section h3,.card-section p{display:none}.btn{min-height:36px;font-size:8px;padding:0 7px}.logout{min-height:34px;margin-top:12px}.menu-button{top:12px;right:12px;width:36px;height:36px}.menu-panel{width:245px}.menu-item{padding:12px 18px;font-size:11px}.sponsor-banner{margin-top:14px;height:122px}.sponsor-title{height:27px;font-size:9px}.sponsor-window{height:95px}.sponsor-slide{width:220px;height:73px}.sponsor-slide strong{font-size:15px}.sponsor-slide span{font-size:8px}}
@media(min-width:601px){.box{padding:30px 34px 28px}.logo{width:195px}h2{font-size:26px}}
</style>
</head>
<body>
<div class="menu-button" onclick="toggleMenu()">☰</div>
<div class="menu-panel" id="menuPanel">
<div class="menu-item" onclick="location.href='2Page.html'">⌂ Home</div><div class="menu-item" onclick="location.href='tornei.html'">▣ Tornei</div><div class="menu-item" onclick="location.href='news.html'">≡ News</div><div class="menu-item" onclick="location.href='mercatino.html'">□ Mercatino</div><div class="menu-item" onclick="location.href='eventi.html'">◷ Eventi</div><div class="menu-item" onclick="location.href='informazioni.html'">ⓘ Informazioni Club</div><div class="menu-item" onclick="location.href='contatti.html'">☎ Contatti</div>
</div>
<div class="box">
<img src="logo_bianco.png" class="logo"><h2 id="welcome">Verifica in corso...</h2><div class="email" id="emailBox"></div>
<div id="adminMenu" class="hidden"><button class="btn" onclick="apriGestioneTorneo()">⚙️ Gestione Torneo</button></div>
<div id="userMenu" class="hidden">
<div class="card-section"><h3>Calendario Tornei</h3><p>Consulta i tornei disponibili e procedi con l'iscrizione.</p><button class="btn" onclick="location.href='visitatore.html'">▣ Iscrizione Tornei</button></div>
<div class="card-section"><h3>News e Comunicazioni</h3><p>Ultime comunicazioni del club.</p><button class="btn" onclick="location.href='news.html'">≡ News</button></div>
</div>
<button class="logout" onclick="logout()">🚪 Esci</button><div id="status"></div>
</div>
<script>
const sb=window.sb=supabase.createClient("https://iybjvtmfaupgthqqsngd.supabase.co","sb_publishable_oLLML3_ne0I1dWKIinSRNA_K1Ao5SOl",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
function toggleMenu(){document.getElementById("menuPanel").classList.toggle("open")}
function esc(v){return String(v??"").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]))}
async function loadSponsors(){const track=document.getElementById("sponsorTrack");try{const {data,error}=await sb.from("tornei").select("id,nome,configurazione");if(error)throw error;const sponsors=[];const seen=new Set();(data||[]).forEach(t=>{const items=t?.configurazione&&Array.isArray(t.configurazione.sponsor)?t.configurazione.sponsor:[];items.forEach(s=>{if(!s||!s.nome)return;const key=String(s.id||((s.nome||"")+"|"+(s.url||"")));if(seen.has(key))return;seen.add(key);sponsors.push({nome:s.nome,descrizione:s.descrizione,url:s.url})})});if(!sponsors.length){track.innerHTML='<div class="sponsor-empty">Nessuno sponsor configurato</div>';track.style.animation="none";return}const make=s=>{const tag=s.url?"a":"div";const href=s.url?' href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer"':'';return '<'+tag+' class="sponsor-slide"'+href+'><strong>'+esc(s.nome)+'</strong><span>'+esc(s.descrizione||"Partner ufficiale")+'</span></'+tag+'>'};track.innerHTML=sponsors.map(make).join("")+sponsors.map(make).join("");if(sponsors.length===1){track.style.animation="none";track.style.justifyContent="center"}}catch(e){console.error("ERRORE SPONSOR:",e);track.innerHTML='<div class="sponsor-empty">Impossibile caricare gli sponsor</div>';track.style.animation="none"}}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){window.location.href="index.html";return}const user=session.user;document.getElementById("welcome").innerHTML="Benvenuto";document.getElementById("emailBox").innerHTML=user.email||"";const {data:profilo,error}=await sb.from("profili").select("nome,cognome,telefono,ruolo").eq("user_id",user.id).maybeSingle();console.log("PROFILO LETTO:",profilo,error);if(error){document.getElementById("status").innerHTML="Errore caricamento profilo";return}if(!profilo||!profilo.nome||!profilo.cognome||!profilo.telefono){window.location.href="profilo.html";return}document.getElementById("welcome").innerHTML="Benvenuto<br>"+profilo.nome+" "+(profilo.cognome||"");if(profilo.ruolo==="admin"){document.getElementById("adminMenu").classList.remove("hidden");document.getElementById("userMenu").classList.remove("hidden");document.getElementById("status").innerHTML="Accesso amministratore"}else{document.getElementById("userMenu").classList.remove("hidden");document.getElementById("status").innerHTML="Accesso giocatore"}}
function apriGestioneTorneo(){window.location.href="admin.html"}async function logout(){await sb.auth.signOut();window.location.href="index.html"}window.addEventListener("load",()=>{init()})
</script>
  <script src="sponsor-public-v2.js?v=8"></script>
</body>
</html>
