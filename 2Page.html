<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Principale</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg-image:url('2pages.jpg');--blue:#004a99;--gold:#ffeb3b;--glass:rgba(255,255,255,0.15);--border:rgba(255,255,255,0.25)}
*{box-sizing:border-box}
body{margin:0;background-image:var(--bg-image);background-size:cover;background-position:center;background-attachment:fixed;font-family:sans-serif;color:white;min-height:100vh;padding:90px 20px 40px}
.box{width:350px;max-width:100%;margin:0 auto;padding:30px;border-radius:25px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,.4);text-align:center}
.logo{width:140px;margin-bottom:10px}h2{margin-top:5px}.email{font-size:13px;opacity:.9;margin-bottom:20px}.btn{width:100%;margin-top:12px;padding:13px;border:none;border-radius:10px;cursor:pointer;font-weight:bold;background:white;color:#004a99;font-size:15px}.btn:hover{opacity:.85}.logout{width:100%;margin-top:20px;padding:12px;border:none;border-radius:10px;cursor:pointer;font-weight:bold;background:#333;color:white}#status{margin-top:15px;min-height:20px;color:#ffeb3b;font-size:14px}.hidden{display:none}.menu-button{position:fixed;top:20px;right:20px;font-size:28px;cursor:pointer;z-index:1000}.menu-panel{position:fixed;top:0;right:-270px;width:250px;height:100vh;background:rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-left:1px solid rgba(255,255,255,.20);box-shadow:-8px 0 32px rgba(0,0,0,.15);transition:.3s;padding-top:70px;z-index:999}.menu-panel.open{right:0}.menu-item{padding:15px 20px;font-size:16px;text-align:left;cursor:pointer;color:white}.menu-item:hover{background:rgba(255,255,255,.15)}.card-section{margin-top:15px;padding:15px;border-radius:15px;background:rgba(255,255,255,.10)}.sponsor-banner{width:100%;height:126px;margin:22px auto 0;border-radius:18px;overflow:hidden;position:relative;background:rgba(255,255,255,.07);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.20);box-shadow:0 6px 24px rgba(0,0,0,.22)}.sponsor-title{height:29px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;text-shadow:0 1px 5px rgba(0,0,0,.4)}.sponsor-window{height:97px;overflow:hidden;position:relative}.sponsor-track{height:100%;display:flex;width:max-content;align-items:center;gap:12px;padding:5px 10px 10px;animation:sponsorScroll 18s linear infinite}.sponsor-slide{width:235px;height:75px;flex:none;border-radius:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.20);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.14);text-decoration:none;color:white}.sponsor-slide strong{font-size:19px;letter-spacing:1px}.sponsor-slide span{font-size:10px;opacity:.78;margin-top:4px}.sponsor-empty{height:75px;display:flex;align-items:center;justify-content:center;width:100%;font-size:12px;opacity:.8;padding:0 12px}@keyframes sponsorScroll{from{transform:translateX(0)}to{transform:translateX(calc(-50% - 6px))}}
@media(min-width:601px){body{padding:70px 30px 50px}.box{width:600px;padding:38px 44px;border-radius:28px}.logo{width:160px;margin-bottom:14px}h2{font-size:28px}.email{font-size:14px;margin-bottom:24px}#userMenu{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card-section{margin-top:15px;padding:18px}.card-section .btn{margin-top:10px;padding:14px;font-size:14px}.sponsor-banner{margin-top:22px;height:132px}.sponsor-title{height:31px;font-size:13px}.sponsor-window{height:101px}.logout{margin-top:18px;padding:13px;font-size:14px}}
@media(max-width:600px){body{padding:58px 10px 25px}.box{width:100%;max-width:390px;padding:18px 14px 16px;border-radius:22px}.logo{width:105px;margin-bottom:3px}h2{font-size:21px;margin:3px 0 5px}.email{font-size:11px;margin-bottom:8px}#userMenu{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card-section{margin-top:6px;padding:0;background:transparent}.card-section h3,.card-section p{display:none}.card-section .btn{margin-top:0;padding:10px 5px;font-size:12px;min-height:42px;white-space:nowrap}.sponsor-banner{margin-top:14px;height:122px}.sponsor-title{height:27px;font-size:11px;letter-spacing:1.8px}.sponsor-window{height:95px}.sponsor-track{gap:10px;padding:5px 8px 9px;animation-duration:16s}.sponsor-slide{width:220px;height:73px}.sponsor-slide strong{font-size:17px}.sponsor-slide span{font-size:9px}.logout{margin-top:10px;padding:9px;font-size:12px}#status{margin-top:8px;font-size:11px;min-height:14px}}
</style>
</head>
<body>
<div class="menu-button" onclick="toggleMenu()">☰</div>
<div class="menu-panel" id="menuPanel">
<div class="menu-item" onclick="location.href='2Page.html'">⌂ Home</div><div class="menu-item" onclick="location.href='tornei.html'">▣ Tornei</div><div class="menu-item" onclick="location.href='news.html'">≡ News</div><div class="menu-item" onclick="location.href='mercatino.html'">□ Mercatino</div><div class="menu-item" onclick="location.href='eventi.html'">◷ Eventi</div><div class="menu-item" onclick="location.href='informazioni.html'">ⓘ Informazioni Club</div><div class="menu-item" onclick="location.href='contatti.html'">☎ Contatti</div>
</div>
<div class="box">
<img src="logo_index.jpg" class="logo"><h2 id="welcome">Verifica in corso...</h2><div class="email" id="emailBox"></div>
<div id="adminMenu" class="hidden"><button class="btn" onclick="apriGestioneTorneo()">⚙️ Gestione Torneo</button></div>
<div id="userMenu" class="hidden">
<div class="card-section"><h3>Calendario Tornei</h3><p>Consulta i tornei disponibili e procedi con l'iscrizione.</p><button class="btn" onclick="location.href='visitatore.html'">▣ Iscrizione Tornei</button></div>
<div class="card-section"><h3>News e Comunicazioni</h3><p>Ultime comunicazioni del club.</p><button class="btn" onclick="location.href='news.html'">≡ News</button></div>
</div>
<div class="sponsor-banner" aria-label="I nostri sponsor"><div class="sponsor-title">I nostri sponsor</div><div class="sponsor-window"><div class="sponsor-track" id="sponsorTrack"><div class="sponsor-empty">Caricamento sponsor...</div></div></div></div>
<button class="logout" onclick="logout()">🚪 Esci</button><div id="status"></div>
</div>
<script>
const sb=window.sb=supabase.createClient("https://iybjvtmfaupgthqqsngd.supabase.co","sb_publishable_oLLML3_ne0I1dWKIinSRNA_K1Ao5SOl",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
function toggleMenu(){document.getElementById("menuPanel").classList.toggle("open")}
function esc(v){return String(v??"").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]))}
async function loadSponsors(){const track=document.getElementById("sponsorTrack");try{const {data,error}=await sb.from("tornei").select("id,nome,configurazione");if(error)throw error;const sponsors=[];const seen=new Set();(data||[]).forEach(t=>{const items=t?.configurazione&&Array.isArray(t.configurazione.sponsor)?t.configurazione.sponsor:[];items.forEach(s=>{if(!s||!s.nome)return;const key=String(s.id||((s.nome||"")+"|"+(s.url||"")));if(seen.has(key))return;seen.add(key);sponsors.push({nome:s.nome,descrizione:s.descrizione,url:s.url})})});if(!sponsors.length){track.innerHTML='<div class="sponsor-empty">Nessuno sponsor configurato</div>';track.style.animation="none";return}const make=s=>{const tag=s.url?"a":"div";const href=s.url?' href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer"':'';return '<'+tag+' class="sponsor-slide"'+href+'><strong>'+esc(s.nome)+'</strong><span>'+esc(s.descrizione||"Partner ufficiale")+'</span></'+tag+'>'};track.innerHTML=sponsors.map(make).join("")+sponsors.map(make).join("");if(sponsors.length===1){track.style.animation="none";track.style.justifyContent="center"}}catch(e){console.error("ERRORE SPONSOR:",e);track.innerHTML='<div class="sponsor-empty">Impossibile caricare gli sponsor</div>';track.style.animation="none"}}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){window.location.href="index.html";return}const user=session.user;document.getElementById("welcome").innerHTML="Benvenuto";document.getElementById("emailBox").innerHTML=user.email||"";const {data:profilo,error}=await sb.from("profili").select("nome,cognome,telefono,ruolo").eq("user_id",user.id).maybeSingle();console.log("PROFILO LETTO:",profilo,error);if(error){document.getElementById("status").innerHTML="Errore caricamento profilo";return}if(!profilo||!profilo.nome||!profilo.cognome||!profilo.telefono){window.location.href="profilo.html";return}document.getElementById("welcome").innerHTML="Benvenuto<br>"+profilo.nome+" "+(profilo.cognome||"");if(profilo.ruolo==="admin"){document.getElementById("adminMenu").classList.remove("hidden");document.getElementById("userMenu").classList.remove("hidden");document.getElementById("status").innerHTML="Accesso amministratore"}else{document.getElementById("userMenu").classList.remove("hidden");document.getElementById("status").innerHTML="Accesso giocatore"}}
function apriGestioneTorneo(){window.location.href="admin.html"}async function logout(){await sb.auth.signOut();window.location.href="index.html"}window.addEventListener("load",()=>{init()})
</script>
  <script src="sponsor-public-v2.js?v=8"></script>
</body>
</html>
